{% extends "pages/base.html" %}

{% block title %}{{ title }} - PCDex{% endblock %}

{% block content %}
    <h1 class="page-header">{{ title }}</h1>
    <div class="form-box card">
        <form method="post">
            {% csrf_token %}
            {{form.as_p}}
            <div class="form-actions">
                <button type="submit">Save Part</button>
                <a href="{%url 'part_list' %}">Back to parts</a>
            </div>
        </form>
    </div>
{% endblock %}
