<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>{% block title %}PCDex{% endblock %}</title>
        <style>
            * {box-sizing: border-box;}

            body {
                margin: 0;
                font-family: system-ui, sans-serif;
                line-height: 1.5;
                background: rgb(255, 0, 0)
            }

            .container {
                max-width: 1000px;
                margin: 0 auto;
                padding: 32px 24px;
            }

            .card {
                background: rgb(255, 255, 255);
                border: 1px solid rgb(194, 194, 194);
                border-radius: 8px;
            }

            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-bottom: 16px;
                margin-bottom: 24px;
                border-bottom: 2px solid rgb(194, 194, 194);
                color: rgb(255, 255, 255);
            }
            .page-header h1 { margin: 0; }

            .search {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 16px;
                margin-bottom: 24px;
            }
            .search input[type="text"] { flex: 1; min-width: 220px; }

            input, select, textarea, button {
                font: inherit;
                padding: 8px 12px;
                border: 1px solid rgb(255, 0, 0);
                border-radius: 6px;
                background: rgb(255, 255, 255);
            }
            button { cursor: pointer; }

            .table-card { overflow-x: auto; }
            table { width: 100%; border-collapse: collapse; }
            th, td {
                text-align: left;
                padding: 12px 16px;
                border-bottom: 1px solid rgb(194, 194, 194);
            }

            .form-box {max-width: 500px; padding: 28px;}
            .form-box p {margin: 0 0 20px;}
            .form-box label {display: block; margin-bottom: 6px;}
            .form-box input, .form-box select {width: 100%;}
            .form-box textarea { width: 100%; height 120px; resize: vertical; }
            .form-actions {display: flex; gap: 16px; align-items: center;}
        </style>
    </head>
    <body>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
