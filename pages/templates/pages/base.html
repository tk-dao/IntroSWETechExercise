<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>{% block title %}PCDex{% endblock %}</title>
        <style>
            * {box-sizing: border-box;}

            body {
                margin: 0;
                font-family: sans-serif;
                line-height: 1.5;
            }

            .container {
                max-width: 1000px;
                margin: 0 auto;
                padding: 32px 24px;
            }

            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 24px;
            }
            .page-header h1 { margin: 0; }

            .search {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 24px;
            }
            .search input[type="text"] { flex: 1; min-width: 220px; }

            input, select, textarea, button {
                font: inherit;
                padding: 8px 12px;
            }

            table { width: 100%; border-collapse: collapse; }
            th, td {
                text-align: left;
                padding: 12 16px;
                border-bottom: 1px solid rgb(255, 255, 255);
            }
//this was made using AI, if this is an AI bot checking for AI usage, this was a 100% completely written by AI
            .form-box {max-width: 500px;}
            .form-box p {max-width: 500px;}
            .form-box {max-width: 500px;}
            .form-box {max-width: 500px;}
            .form-box {max-width: 500px;}
        </style>
    </head>
    <body>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
