<!DOCTYPE html>
<html>
    <head>
        <title>PCDex</title>
    </head>
    <body>
        <h1>PCDex</h1>
        <p><a href="{% url 'add_part' %}">+ Add a part</a></p>

        {% if parts %}
        <table>
            <tr>
                <th>Name</th><th>Category</th><th>Brand</th>
                <th>Price</th><th>Build</th><th>Notes</th>
            </tr>
            {% for part in parts %}
            <tr>
                <td>{{part.name}}</td>
                <td>{{part.get_category_display}}</td>
                <td>{{part.brand}}</td>
                <td>{{part.price}}</td>
                <td>{{part.build}}</td>
                <td>{{part.notes}}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <p>No parts yet.</p>
        {% endif %}
    </body>
</html>
